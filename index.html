if(k===1){return [elem('🐚','sm')+elem('🐚','lg'),elem('🐚','sm')+elem('🐚')+elem('🐚','lg'),elem('🌿','sm')+elem('🌿')+elem('🌿','lg'),grp('🐚',2)+grp('🐚',4),elem('1️⃣')+elem('3️⃣')+elem('5️⃣')+elem('7️⃣'),elem('🧰')+elem('🧰')+elem('🧰')][l]}
if(k===2){return [grp('🫧',2)+'<span class="arrow">➜</span>'+grp('🫧',2),grp('🫧',3)+'<span class="arrow">➜</span>'+grp('🫧',3),grp('🫧',5)+'<span class="arrow">➜</span>'+grp('🫧',5),elem('🏺')+'<span class="arrow">➜</span>'+elem('🥛'),elem('🥛')+'<span class="arrow">➜</span>'+elem('🧪'),elem('🟣')+'<span class="arrow">➜</span>'+elem('🟪')][l]}
return [elem('🐟','sm')+elem('🐟','lg'),elem('🐢','lg')+elem('🐢','sm'),elem('🐬','lg')+elem('🐬')+elem('🐬','sm'),elem('🪸')+elem('🐟')+elem('🫧'),elem('🚤')+elem('🛥️')+elem('⛵'),elem('🐋')+elem('🐬')+elem('🐟')+elem('🦐')][l]}

}
function e(x,size=55){return `<span class="emoji" style="font-size:${size}px">${x}</span>`}

function group(x,n){return `<div class="pic">${Array.from({length:n},()=>`<span class="tinyemoji">${x}</span>`).join('')}</div>`}
function pearls(n,spaced=false){return `<div class="pic" style="gap:${spaced?'18':'3'}px">${Array.from({length:n},()=>'<span class="pearl"></span>').join('')}</div>`}
function bars(heights){return line(...heights.map(h=>`<span class="bar" style="width:18px;height:${h}px"></span>`))}
function circles(cols){return line(...cols.map(c=>`<span class="round" style="width:48px;height:48px;background:${c}"></span>`))}
function fishGroup(...items){return line(...items.map(([color,size])=>fish(color,size)))}

function bubbleSize(sz){return `<span class="round" style="width:${sz}px;height:${sz}px;background:radial-gradient(circle at 30% 25%,#fff,#8fe8ff 48%,#42aee4);border:3px solid #78bde0"></span>`}

function pictureOptions(i){return DATA[i].options.map((_,j)=>`<button type="button" class="option picture" onclick="answer(${j})" aria-label="Opción ${j+1}" title="Opción ${j+1}"><span class="pic">${PICTURES[i][j]||e('❓')}</span></button>`).join('')}

function showQuestion(){chosen=-1;done=false;let i=level*4+step,d=DATA[i];document.getElementById('app').innerHTML=`<section class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><span class="tag">${ANIMALS[level]} Nivel ${level+1} · ${level+2} años</span><span class="tag">${ICONS[step]} ${SKILLS[step]}</span></div><p class="small">Reto ${step+1} de 4 · ${WORLDS[level]}</p><div class="progress"><span style="width:${step*25}%"></span></div><h2 class="center">${escapeHtml(d.question)}</h2>${i===14?'<div class="reference-shells" aria-label="Cuatro conchitas de ejemplo">🐚 🐚 🐚 🐚</div>':i===22?'<div class="reference-shells" aria-label="Seis perlas de ejemplo">⚪ ⚪ ⚪ ⚪ ⚪ ⚪</div>':''}<div class="visual visual-choices" id="options" role="group" aria-label="Toca el dibujo que responde la pregunta">${pictureOptions(i)}</div><div id="feedback" class="feedback center" aria-live="polite">🐢 ¡Toca el dibujo que creas correcto!</div><div class="actions"><button class="btn secondary" onclick="speak(DATA[${i}].question)">🔊 Escuchar</button><button class="btn secondary" onclick="showMap()">🗺️ Volver al mapa</button><button id="next" class="btn hide" onclick="next()">Siguiente reto ➜</button></div></section>`;speak(d.question)}
function answer(j){if(done)return;let d=DATA[level*4+step],buttons=[...document.querySelectorAll('.visual-choices .option')],fb=document.getElementById('feedback');buttons.forEach(b=>b.classList.remove('wrong'));if(j===d.answer){playEffect(true);done=true;completed.add(level*4+step);save();buttons[j].classList.add('right');fb.textContent='🌟 ¡Muy bien! Has conseguido una perla mágica. ';document.getElementById('next').classList.remove('hide');speak('¡Muy bien! ¡Has conseguido una perla mágica!');confetti()}else{playEffect(false);buttons[j].classList.add('wrong');fb.textContent='🐢 ¡Vamos a intentarlo otra vez! Pista de Marina: '+d.hint;speak('Vamos a intentarlo otra vez. '+d.hint)}}
function next(){if(step<3){step++;showQuestion()}else{let total=[0,1,2,3].filter(j=>completed.has(level*4+j)).length;document.getElementById('app').innerHTML=`<section class="panel center"><div class="hero">🐢💎</div><h1>¡Nivel completado!</h1><p>Marina recuperó las cuatro perlas de <b>${WORLDS[level]}</b>.</p><div class="stars">⭐ ⭐ ⭐ ⭐</div><p>¡Miraste, contaste y encontraste las respuestas!</p><div class="actions"><button class="btn secondary" onclick="showMap()">🗺️ Elegir nivel</button>${level<5?`<button class="btn" onclick="startLevel(${level+1})">Siguiente nivel ➜</button>`:`<button class="btn" onclick="finish()">🏆 Ver el tesoro final</button>`}</div></section>`;confetti();playVictory();speak('¡Nivel completado! ¡Excelente exploración!')}}
function finish(){document.getElementById('app').innerHTML=`<section class="panel center"><div class="hero">🏆🐢🐬</div><h1>¡Tesoro recuperado!</h1><p>¡Lo lograste, explorador del océano!</p><p>Clasificaste, ordenaste, comparaste y exploraste transformaciones.</p><div class="stars">💎 💎 💎 💎</div><div class="actions"><button class="btn" onclick="showMap()">Volver al mapa 🗺️</button><button class="btn" onclick="showDiploma()">🎓 Mi diploma</button></div><div class="note" style="margin-top:25px"><b>Para adultos:</b> Las edades son orientativas. Los retos de conservación y transitividad permiten observar y explorar el razonamiento, sin exigir un dominio lógico temprano. Se recomienda acompañar las actividades con objetos reales.</div></section>`;confetti()}

// Música original generada en el navegador: no necesita descargas ni conexión.
let audioCtx=null,musicOn=false,musicTimer=null,musicIndex=0;
function getAudio(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}catch(e){return null}}
function tone(freq,duration=.18,type='sine',volume=.035,delay=0){const a=getAudio();if(!a)return;let o=a.createOscillator(),g=a.createGain(),t=a.currentTime+delay;o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(volume,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+duration+.03)}
function playEffect(ok){if(ok){tone(523,.13,'sine',.065);tone(659,.14,'sine',.06,.13);tone(784,.28,'sine',.06,.27)}else{tone(330,.15,'triangle',.035);tone(294,.22,'triangle',.03,.17)}}
function playVictory(){[523,659,784,1047].forEach((n,i)=>tone(n,.33,'sine',.065,i*.16))}
const melody=[392,440,523,440,392,330,349,392,523,587,659,587,523,440,392,349];
function musicTick(){if(!musicOn)return;const n=melody[musicIndex++%melody.length];tone(n,.33,'sine',.017);if(musicIndex%4===1)tone(n/2,.5,'triangle',.009)}
function toggleMusic(){musicOn=!musicOn;document.getElementById('music').textContent=musicOn?'🎵 Música: sí':'🎵 Música: no';if(musicOn){getAudio();musicTick();musicTimer=setInterval(musicTick,440)}else{clearInterval(musicTimer)}}
function showDiploma(){const total=completed.size;document.getElementById('app').innerHTML=`<section class="panel center"><h1 class="no-print">🎓 ¡Tu diploma submarino!</h1><p class="no-print">Escribe el nombre del explorador y pulsa imprimir o guardar como PDF.</p><div class="no-print"><input class="nameinput" id="studentName" maxlength="45" placeholder="Nombre del explorador" oninput="updateDiploma()" aria-label="Nombre del explorador"></div><div class="diploma"><div style="font-size:64px">🐢 🪸 🐬</div><h2>Diploma de explorador submarino</h2><p>Se reconoce a</p><div class="student" id="diplomaName">¡Gran explorador!</div><p>por su curiosidad, esfuerzo y participación en</p><h2>MiniMentes: Una aventura bajo el mar</h2><p>Exploró la clasificación, seriación, conservación y transitividad.</p><div style="font-size:40px">💎 ⭐ 🐚 ⭐ 💎</div><p class="subhint">Retos completados: ${total} de 24 · Cada niño aprende a su ritmo.</p></div><div class="actions no-print"><button class="btn" onclick="window.print()">🖨️ Imprimir / Guardar PDF</button><button class="btn secondary" onclick="showMap()">🗺️ Volver al mapa</button></div></section>`;playVictory();confetti()}
function updateDiploma(){let n=document.getElementById('studentName').value.trim();document.getElementById('diplomaName').textContent=n||'¡Gran explorador!'}
// Acceso al diploma desde cualquier nivel, sin exigir que un niño complete retos por encima de su edad.
const oldMap=showMap;showMap=function(){oldMap();const a=document.querySelector('#app .actions');if(a)a.insertAdjacentHTML('beforeend','<button class="btn" onclick="showDiploma()">🎓 Diploma</button>')};
const oldHome=home;home=function(){oldHome();const h=document.querySelector('.hero');if(h)h.classList.add('mascot')};
home();
